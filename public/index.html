<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปิดปรับปรุง</title>
<style>
  :root{
    --bg: #14171c;
    --bg2: #1b1f26;
    --amber: #f5b400;
    --amber-dark: #b57e00;
    --ink: #f2ede2;
    --ink-dim: #9aa0ab;
    --stripe: #22262e;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family: "Kanit","Segoe UI",sans-serif;
    overflow-x:hidden;
  }

  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap');

  .stripes{
    position:fixed;
    inset:0;
    background:
      repeating-linear-gradient(
        135deg,
        var(--amber) 0 28px,
        var(--stripe) 28px 56px
      );
    opacity:0.06;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
    text-align:center;
    gap:28px;
  }

  .tape{
    display:inline-block;
    background: repeating-linear-gradient(
      -45deg,
      var(--amber) 0 18px,
      #111 18px 36px
    );
    color:#111;
    font-weight:700;
    font-size:clamp(0.75rem, 1.4vw, 1rem);
    letter-spacing:3px;
    padding:6px 22px;
    transform:rotate(-2deg);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .tape span{
    background:var(--bg2);
    color:var(--amber);
    padding:2px 10px;
    -webkit-text-stroke: 0;
  }

  .gear-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:4px;
  }
  .gear{
    width:64px;
    height:64px;
    animation: spin 6s linear infinite;
  }
  .gear.rev{ animation-direction: reverse; animation-duration: 4.5s; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .gear{ animation: none; }
  }

  h1{
    font-size:clamp(2rem, 6vw, 3.6rem);
    font-weight:700;
    margin:0;
    color:var(--ink);
    line-height:1.15;
  }
  h1 .hi{ color:var(--amber); }

  p.lead{
    max-width:560px;
    font-size:clamp(1rem, 2.2vw, 1.15rem);
    color:var(--ink-dim);
    line-height:1.7;
    margin:0;
  }

  .laugh{
    font-weight:600;
    color:var(--amber);
  }

  .bar-wrap{
    width:min(420px, 80vw);
    height:20px;
    background:var(--stripe);
    border-radius:999px;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(245,180,0,.25);
  }
  .bar-fill{
    height:100%;
    width:63%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--amber-dark), var(--amber));
    position:relative;
    animation:wiggle 2.6s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{ width:60%; }
    50%{ width:66%; }
  }
  .bar-label{
    font-size:.85rem;
    color:var(--ink-dim);
    letter-spacing:1px;
  }

  .footnote{
    font-size:.8rem;
    color:#5b6270;
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="stripes"></div>

<div class="wrap">

  <div class="tape"><span>⚠ อยู่ระหว่างปรับปรุง ⚠</span></div>

  <div class="gear-row">
    <svg class="gear" viewBox="0 0 100 100" fill="none">
      <path fill="#f5b400" d="M50 10 L58 10 L60 24 L70 28 L82 20 L88 26 L80 38 L84 48 L98 50 L98 58 L84 60 L80 70 L88 82 L82 88 L70 80 L60 84 L58 98 L50 98 L48 84 L38 80 L26 88 L20 82 L28 70 L24 60 L10 58 L10 50 L24 48 L28 38 L20 26 L26 20 L38 28 L48 24 Z"/>
      <circle cx="54" cy="54" r="16" fill="#14171c"/>
    </svg>
    <svg class="gear rev" viewBox="0 0 100 100" fill="none">
      <path fill="#f5b400" d="M50 10 L58 10 L60 24 L70 28 L82 20 L88 26 L80 38 L84 48 L98 50 L98 58 L84 60 L80 70 L88 82 L82 88 L70 80 L60 84 L58 98 L50 98 L48 84 L38 80 L26 88 L20 82 L28 70 L24 60 L10 58 L10 50 L24 48 L28 38 L20 26 L26 20 L38 28 L48 24 Z"/>
      <circle cx="54" cy="54" r="16" fill="#14171c"/>
    </svg>
  </div>

  <h1>เว็บนี้กำลัง<span class="hi">แต่งหน้าทำผม</span><br>รอแป๊บนึงนะ ไม่ค่อยมีสมองด้วย</h1>

  <p class="lead">
    ทีมงานกำลังไขน็อต ปะรอยรั่ว แล้วก็แอบชงกาแฟไปด้วย <span class="laugh">555</span><br>
    เดี๋ยวกลับมาสวยกว่าเดิมแน่นอน แวะมาใหม่อีกทีนะ 🙏
  </p>

  <div class="bar-wrap"><div class="bar-fill"></div></div>
  <div class="bar-label">กำลังดำเนินการ...</div>

  <div class="footnote">หากเรื่องด่วนมาก ติดต่อทีมงานได้ตามช่องทางปกติ</div>

</div>

</body>
</html>
